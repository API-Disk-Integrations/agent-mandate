name: Publish initial npm release (N2 bootstrap)

on:
  push:
    tags:
      - 'npm-v1.0.0'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.repository == 'API-Disk-Integrations/agent-mandate' &&
      github.ref == 'refs/tags/npm-v1.0.0'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.20.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Verify immutable bootstrap identity
        working-directory: packages/typescript
        run: |
          test "$GITHUB_REPOSITORY" = 'API-Disk-Integrations/agent-mandate'
          test "$GITHUB_REF" = 'refs/tags/npm-v1.0.0'
          test "$(node -p "require('./package.json').name")" = 'agent-mandate'
          test "$(node -p "require('./package.json').version")" = '1.0.0'
          test "$(npm config get registry)" = 'https://registry.npmjs.org/'
      - name: Build, test, and reproduce the accepted archive
        working-directory: packages/typescript
        env:
          SOURCE_DATE_EPOCH: '1788572548'
        run: |
          test "$(npm --version)" = '11.19.0'
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
          mkdir -p release-dist
          npm pack --ignore-scripts --pack-destination release-dist
          (cd release-dist && sha256sum -c ../release.sha256)
          test "$(sha256sum release-dist/agent-mandate-1.0.0.tgz | cut -d ' ' -f 1)" = 'a6546c783d712372c4d58e30a537744d0f24f77b086377aa37de302a8ce957b2'
      - name: Publish exact first release with provenance
        working-directory: packages/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_N2_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish release-dist/agent-mandate-1.0.0.tgz --access public --provenance --ignore-scripts

# This is a one-release replacement for the accepted stage-only workflow.
# It is not eligible to enter the repository until the separately recorded N2
# credential-scope exception, one-operation release authorization, current
# provider/name preflight, and independent final-byte audit all pass. After any
# terminal result, delete the environment secret and revoke the npm token.
