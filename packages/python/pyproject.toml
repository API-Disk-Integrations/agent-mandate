[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agent-mandate"
version = "1.0.0"
description = "Convert user intent into signed mandates and verify consequential agent actions against mandate, policy and approvals."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "API Disk Integrations" }]
keywords = ["api", "sdk", "agent-mandate"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[tool.hatch.build]
ignore-vcs = true

[project.urls]
Homepage = "https://agentmandate-api.com/"
Documentation = "https://agentmandate-api.com/#docs"
Pricing = "https://agentmandate-api.com/#pricing"
Privacy = "https://agentmandate-api.com/privacy"
Terms = "https://agentmandate-api.com/terms"
Source = "https://github.com/API-Disk-Integrations/agent-mandate"
Issues = "https://github.com/API-Disk-Integrations/agent-mandate/issues"
Changelog = "https://github.com/API-Disk-Integrations/agent-mandate/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mandate"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/agent_mandate/__init__.py",
]
